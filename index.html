<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Altarys — Dépannage, maintenance &amp; réseaux informatiques</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500;600&display=swap">
<style>
:root{--navy:#031D52;--navy-d:#021440;--gold:#F1B612;--ivory:#F7F1E3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{font-family:'Montserrat',system-ui,sans-serif;font-weight:300;background:var(--navy);color:var(--ivory);line-height:1.7;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
.wrap{width:min(1120px,100% - 48px);margin-inline:auto}
.eyebrow{font-size:.72rem;letter-spacing:.38em;text-transform:uppercase;color:var(--gold);font-weight:500;display:flex;align-items:center;gap:14px}
.eyebrow::before{content:"";width:36px;height:1px;background:var(--gold)}
h1,h2,h3{font-weight:200;letter-spacing:.02em;line-height:1.15}
h2{font-size:clamp(1.9rem,4vw,3rem);margin:18px 0 22px}
h2 em,h1 em{font-style:normal;color:var(--gold);font-weight:300}
.star{display:inline-block;width:1em;height:1em;background:var(--gold);clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%)}
/* header */
header{position:fixed;inset:0 0 auto;z-index:20;padding-top:env(safe-area-inset-top,0px);background:rgba(3,29,82,.82);backdrop-filter:blur(14px);border-bottom:1px solid rgba(241,182,18,.25)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:74px}
header img{height:34px;width:auto}
nav{display:flex;gap:34px;align-items:center}
nav a{font-size:.74rem;letter-spacing:.24em;text-transform:uppercase;font-weight:400;opacity:.85;transition:.3s}
nav a:hover{color:var(--gold);opacity:1}
.btn{display:inline-block;padding:15px 34px;border:1px solid var(--gold);color:var(--gold);font-size:.74rem;letter-spacing:.26em;text-transform:uppercase;font-weight:500;transition:.35s}
.btn:hover,nav a.btn:hover{background:var(--gold);color:var(--navy)}
.btn.solid{background:var(--gold);color:var(--navy)}
.btn.solid:hover{background:transparent;color:var(--gold)}
nav a.btn{padding:11px 22px;opacity:1}
/* hero */
.hero{position:relative;min-height:100vh;display:flex;align-items:center;padding:140px 0 90px;background:radial-gradient(ellipse at 75% 40%,#0A2D72 0,var(--navy) 55%,var(--navy-d) 100%);overflow:hidden}
#sky{position:absolute;inset:0;width:100%;height:100%}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.15fr .85fr;gap:60px;align-items:center}
h1{font-size:clamp(2.4rem,5.6vw,4.6rem);margin:24px 0 28px}
.lead{max-width:520px;font-size:1.05rem;opacity:.85}
.cta{display:flex;gap:18px;flex-wrap:wrap;margin-top:42px}
.emblem{position:relative;justify-self:center;width:min(380px,80%);animation:float 7s ease-in-out infinite}
.emblem::before{content:"";position:absolute;inset:-12%;background:radial-gradient(circle,rgba(241,182,18,.22),transparent 65%);z-index:-1}
.emblem img{filter:drop-shadow(0 30px 50px rgba(0,0,0,.45))}
@keyframes float{50%{transform:translateY(-14px)}}
.scroll{position:absolute;bottom:26px;left:50%;translate:-50% 0;font-size:.65rem;letter-spacing:.4em;text-transform:uppercase;color:var(--gold);opacity:.8;text-align:center}
.scroll::after{content:"";display:block;width:1px;height:38px;margin:10px auto 0;background:linear-gradient(var(--gold),transparent)}
/* sections */
section{padding:120px 0;position:relative}
.ivory{background:var(--ivory);color:var(--navy)}
.ivory .eyebrow,.ivory h2 em{color:#B8860B}
.ivory .eyebrow::before{background:#B8860B}
.about{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:center}
.about p+p{margin-top:18px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:rgba(3,29,82,.18);border:1px solid rgba(3,29,82,.18)}
.stats div{background:var(--ivory);padding:38px 28px}
.stats b{display:block;font-weight:200;font-size:3rem;line-height:1;color:var(--navy)}
.stats b i{font-style:normal;color:#B8860B}
.stats span{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;font-weight:500}
.head{text-align:center;max-width:640px;margin:0 auto 70px}
.head .eyebrow{justify-content:center}
.head .eyebrow::before{display:none}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.card{padding:46px 38px;border:1px solid rgba(241,182,18,.35);background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,0));transition:.45s;position:relative}
.card:hover{transform:translateY(-8px);border-color:var(--gold);background:rgba(241,182,18,.06)}
.card .star{font-size:1.5rem;margin-bottom:26px}
.card h3{font-size:1.45rem;font-weight:300;margin-bottom:14px}
.card p{opacity:.8;font-size:.95rem}
.card small{display:block;margin-top:26px;color:var(--gold);font-size:.68rem;letter-spacing:.28em;text-transform:uppercase;font-weight:500}
/* constellation */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:30px;position:relative;margin-top:30px}
.steps::before{content:"";position:absolute;top:11px;left:6%;right:6%;border-top:1px dashed rgba(3,29,82,.4)}
.step{position:relative;padding-top:48px}
.step .star{position:absolute;top:0;left:0;font-size:1.4rem;background:#B8860B}
.step h3{font-size:1.2rem;font-weight:400;margin-bottom:8px}
.step p{font-size:.92rem;opacity:.8}
.quote{text-align:center;padding:130px 0;background:radial-gradient(ellipse at 50% 0,#0A2D72,var(--navy-d))}
.quote blockquote{font-weight:200;font-size:clamp(1.5rem,3.2vw,2.4rem);line-height:1.4;max-width:820px;margin:26px auto}
.quote cite{font-style:normal;color:var(--gold);font-size:.72rem;letter-spacing:.3em;text-transform:uppercase;font-weight:500}
/* contact */
.contact{display:grid;grid-template-columns:1fr 1fr;gap:80px}
.contact ul{list-style:none;margin-top:36px;padding:0}
.contact li{padding:16px 0;border-bottom:1px solid rgba(241,182,18,.25);font-size:.95rem}
.contact li b{display:block;color:var(--gold);font-size:.66rem;letter-spacing:.3em;text-transform:uppercase;font-weight:500}
form{display:grid;gap:22px}
label{font-size:.66rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);font-weight:500}
input,textarea{width:100%;background:transparent;border:0;border-bottom:1px solid rgba(247,241,227,.4);color:var(--ivory);font:inherit;padding:10px 0;outline:0;transition:.3s}
input:focus,textarea:focus{border-color:var(--gold)}
textarea{resize:vertical;min-height:90px}
form button{justify-self:start;cursor:pointer;background:var(--gold);font-family:inherit}
#ok{color:var(--gold);font-size:.9rem;min-height:1.4em}
footer{border-top:1px solid rgba(241,182,18,.3);padding:44px 0 36px;background:var(--navy-d);font-size:.74rem;letter-spacing:.14em}
footer .wrap{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:20px}
footer img{height:30px;width:auto}
.fade{opacity:0;transform:translateY(28px);transition:1s cubic-bezier(.2,.7,.2,1)}
.fade.in{opacity:1;transform:none}
@media(max-width:860px){nav a:not(.btn){display:none}.hero .wrap,.about,.contact{grid-template-columns:1fr;gap:48px}.emblem{order:-1;width:200px}.cards,.steps{grid-template-columns:1fr}.steps::before{display:none}section{padding:84px 0}h1{margin-top:14px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
::selection{background:var(--gold);color:var(--navy)}
body{letter-spacing:.015em}... (404 Ko restants)
